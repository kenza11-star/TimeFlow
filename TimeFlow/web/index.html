function calc(){const K=[['C','fn'],['±','fn'],['%','fn'],['/','op','÷'],'7','8','9',['*','op','×'],'4','5','6',['-','op','−'],'1','2','3',['+','op','+'],['0','z'],'.',['=','eq']];
 return `${head('Calculator','Cepat dan andal.',1)}<div class="disp"><p class="mut" id="ce">${cdisp(cs.e)||'&nbsp;'}</p><b id="cr">${esc(cs.r)||'0'}</b></div><div class="calc">${K.map(k=>{k=[].concat(k);return `<button class="${k[1]||''}" data-a="ck" data-k="${k[0]}" aria-label="${k[2]||k[0]}">${k[2]||k[0]}</button>`}).join('')}<button data-a="ck" data-k="del" aria-label="Hapus digit" style="grid-column:span 4;aspect-ratio:auto;height:48px;border-radius:24px">⌫ Hapus</button></div>`}
function calcEval(s){const t=s.match(/\d+\.?\d*|\.\d+|[-+*/()%]/g)||[];let i=0;const p=()=>t[i];
 const ex=()=>{let v=tm();while(p()=='+'||p()=='-'){const o=t[i++],r=tm();v=o=='+'?v+r:v-r}return v};
 const tm=()=>{let v=un();while(p()=='*'||p()=='/'){const o=t[i++],r=un();if(o=='/'&&r===0)throw Error('div0');v=o=='*'?v*r:v/r}return v};
 const un=()=>{if(p()=='-'){i++;return -un()}if(p()=='+'){i++;return un()}return po()};
 const po=()=>{let v=pr();while(p()=='%'){i++;v/=100}return v};
 const pr=()=>{const x=t[i++];if(x=='('){const v=ex();if(t[i++]!=')')throw Error('x');return v}if(x===undefined||isNaN(+x))throw Error('x');return +x};
 const v=ex();if(i<t.length)throw Error('x');return v}

 else if(k==='='){if(!cs.e)return;try{const v=calcEval(cs.e);cs.r=String(+v.toPrecision(12));cs.e=cs.r}catch(e){cs.r=e.message==='div0'?'Tidak bisa dibagi nol':'Ekspresi tidak valid';cs.e=''}}
 else{if(cs.r&&!/^-?[\d.]+$/.test(cs.r)){cs.r=''}cs.e+=k;try{cs.r=String(+calcEval(cs.e).toPrecision(12))}catch{cs.r=''}}
 $('#ce').innerHTML=cdisp(cs.e)||'&nbsp;';$('#cr').textContent=cs.r||'0'}
