# Alternatif build tanpa Termux: fork/push repo ini ke GitHub lalu jalankan workflow ini (tab Actions).
name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleBundledDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TimeFlow-debug-apk
          path: android/app/build/outputs/apk/bundled/debug/*.apk
