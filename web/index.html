const WEB={snd:[],ring:null,wl:null,ctx:null,keep:null,reg:null,sw:null},BUILTIN=[['builtin:classic','Klasik'],['builtin:digital','Digital'],['builtin:soft','Lembut'],['builtin:melody','Melodi']];

function kv(m,k,v){return new Promise((res,rej)=>{let r;const q=indexedDB.open('timeflow-media',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onerror=()=>rej(q.error);
 q.onsuccess=()=>{const d=q.result,t=d.transaction('kv',m==='get'||m==='keys'?'readonly':'readwrite'),s=t.objectStore('kv');r=m==='get'?s.get(k):m==='set'?s.put(v,k):m==='del'?s.delete(k):s.getAllKeys();t.oncomplete=()=>{d.close();res(r.result)};t.onerror=t.onabort=()=>rej(t.error||new Error('Penyimpanan media gagal'))}})}
const TONES={'builtin:classic':{p:1.6,t:'square',n:[[880,0,.2],[880,.3,.2],[880,.6,.2],[880,.9,.2]]},'builtin:digital':{p:1.2,t:'square',n:[[1500,0,.08],[1500,.14,.08],[1500,.28,.08],[1500,.42,.08],[1500,.7,.3]]},'builtin:soft':{p:2.4,t:'sine',n:[[523,0,.5],[659,.5,.5],[784,1,.9]]},'builtin:melody':{p:3,t:'triangle',n:[[523,0,.3],[659,.35,.3],[784,.7,.3],[1047,1.05,.5],[784,1.7,.3],[659,2.05,.3],[523,2.4,.5]]}};
const tone=id=>TONES[id]||TONES['builtin:classic'];
function actx(){if(!WEB.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{WEB.ctx=new C()}catch{return null}}if(WEB.ctx.state==='suspended')WEB.ctx.resume().catch(()=>{});return WEB.ctx}
function playTone(id,vol){const T=tone(id),c=actx();if(!c)return;const t0=c.currentTime+.02,g=c.createGain();g.gain.value=Math.max(0,Math.min(1,vol));g.connect(c.destination);
 T.n.forEach(([f,st,d])=>{const o=c.createOscillator(),e=c.createGain();o.type=T.t;o.frequency.value=f;e.gain.setValueAtTime(0,t0+st);e.gain.linearRampToValueAtTime(.5,t0+st+.02);e.gain.linearRampToValueAtTime(0,t0+st+d);o.connect(e);e.connect(g);o.start(t0+st);o.stop(t0+st+d+.05)})}

let unlocked=false;
function silentWav(){if(WEB.sw)return WEB.sw;const n=8000,b=new Uint8Array(44+n),dv=new DataView(b.buffer),w=(o,x)=>[...x].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
 w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);for(let i=0;i<n;i++)b[44+i]=128+(i%2?1:-1);

function ringStart(a){let R=WEB.ring;if(R&&R.items.some(x=>x.id===a.id)){return}
 if(!R){R=WEB.ring={items:[],iv:0,vi:0,el:null,to:0};R.items.push(a);ringUi();ringSound(a);ringVib(a);wake();R.to=setTimeout(()=>ringStop(true),10*60e3)}else{R.items.push(a);ringUi()}
 sysNotify(a);try{document.title='⏰ '+(a.label||'Alarm')}catch{}}
function ringStop(auto){const R=WEB.ring;if(!R)return;WEB.ring=null;clearTimeout(R.to);clearInterval(R.iv);clearInterval(R.vi);if(R.el){R.el.pause();URL.revokeObjectURL(R.el.src)}try{navigator.vibrate&&navigator.vibrate(0)}catch{}

 if(auto){const a=R.items[0];toast('Alarm terlewat: '+(a.label||a.time),'err');if('Notification'in window&&Notification.permission==='granted')swReg().then(r=>r&&r.showNotification('Alarm terlewat',{body:(a.label||'Alarm')+' pukul '+a.time,tag:'tf-missed',icon:ICON})).catch(()=>{})}

function ringSnooze(){const R=WEB.ring;if(!R)return;R.items.forEach(a=>{if(a.id==='test')return;const x=D.alarms.find(y=>y.id===a.id);if(x)x.snoozeAt=Date.now()+(x.snooze||10)*60000});save();ringStop();toast('Ditunda');keepAlive();if(sub==='alarm')render()}
// ---- penjadwal (dicek tiap detik; toleransi 3 menit bila halaman sempat dibekukan sistem) ----
function alarmTick(){if(!D||NATIVE)return;const n=new Date();let ch=false;
 D.alarms.forEach(a=>{if(a.snoozeAt&&Date.now()>=a.snoozeAt){a.snoozeAt=0;ch=true;ringStart(a);return}
  if(!a.on)return;
  for(let back=0;back<=3;back++){const t=new Date(n.getTime()-back*60000),m=t.getHours()*60+t.getMinutes(),st=mins(a.time),key=ymd(t)+pad(t.getHours())+pad(t.getMinutes());
   if(a.days&&a.days.length&&!a.days.includes(t.getDay()))continue;
   const ev=a.every|0,un=mins(a.until||'23:59'),hit=ev?(m>=st&&m<=un&&(m-st)%ev===0):m===st;
   if(!hit)continue;if(a.lk&&a.lk>=key)break;
   a.lk=key;ch=true;if(!(a.days&&a.days.length)&&(!ev||m+ev>un))a.on=false;ringStart(a);break}});
